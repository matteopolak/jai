name: static reference analysis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Download the authorized reference data asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reference/bin
          gh release download reference-0.2.009 --repo "$GITHUB_REPOSITORY" --pattern jai-macos --dir reference/bin
          chmod 400 reference/bin/jai-macos
      - name: Verify supplied binary identity
        run: |
          echo 'a76ba6e153838a81e3ed4edbcc4ec42ad86c333cdeaf4053fdc592ed0b61600e  reference/bin/jai-macos' | shasum -a 256 -c -
      - name: Install trusted LLVM disassembly tools
        run: |
          brew install llvm@22
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"
      - name: Read every executable section without executing supplied code
        run: |
          python3 tools/audit_reference.py --binary bin/jai-macos
          python3 tools/analyze_macos_calls.py
      - name: Retain inspection reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-reference-inspection
          path: artifacts/audit/
          if-no-files-found: warn
          retention-days: 14
