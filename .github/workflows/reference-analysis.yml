name: static reference analysis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Download data from the unpublished input release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/runner
          gh release download audit-inputs-2026-10-01 --repo "$GITHUB_REPOSITORY" --pattern reference-inputs.tar.gz --dir artifacts/runner
      - name: Verify hashes and extract read-only input data
        run: python3 tools/runner_inputs.py extract
      - name: Install trusted disassembly tools
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Inspect every compiler and linker executable section
        run: |
          python3 tools/audit_reference.py
          python3 tools/analyze_macos_calls.py
      - name: Install pinned Rust tooling
        run: rustup toolchain install nightly-2026-08-29 --profile minimal
      - name: Check dependency ages before compilation
        run: python3 tools/check_dependency_age.py
      - name: Run compiler tests against the supplied source corpus
        run: cargo test --workspace --locked
      - name: Benchmark smoke checks
        run: cargo bench -p jai-bench --bench compiler --locked -- --test
      - name: Retain inspection reports (never original executable bytes)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-reference-inspection
          path: artifacts/audit/
          if-no-files-found: warn
          retention-days: 14
