name: bounded reference probes
on:
  workflow_dispatch:
    inputs:
      audit_run:
        description: Successful static reference analysis run ID
        required: true
        default: '36939979892'
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Check prior hosted static analysis
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_RUN: ${{ inputs.audit_run }}
        run: |
          gh run view "$AUDIT_RUN" --repo "$GITHUB_REPOSITORY" --json workflowName,status,conclusion > audit-run.json
          python3 -c 'import json; r=json.load(open("audit-run.json")); assert r["workflowName"]=="static reference analysis" and r["status"]=="completed" and r["conclusion"]=="success", "a successful static inspection is required"'
      - name: Download the authorized compiler asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reference/bin
          gh release download reference-0.2.009 --repo "$GITHUB_REPOSITORY" --pattern jai-macos --dir reference/bin
          chmod 400 reference/bin/jai-macos
      - name: Stage the authorized vendored bootstrap
        run: |
          mkdir -p reference/modules
          cp vendor/jai-0.2.009/modules/Preload.jai reference/modules/Preload.jai
          chmod 400 reference/modules/Preload.jai
      - name: Native version/help probes with network denied
        run: python3 tools/probe_reference.py
      - name: Retain probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bounded-reference-probes
          path: artifacts/probe/
          if-no-files-found: warn
          retention-days: 14
